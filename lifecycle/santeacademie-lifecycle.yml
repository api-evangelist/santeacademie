recommendations:
- >-
  Publish a machine-readable status feed. The status page already tracks `frontstage` per-service; a JSON or Atom
  endpoint would make that state consumable by the systems that actually call the API.
- >-
  Version the two public APIs, or state plainly that they are internal. Right now there is no version to pin, no
  changelog to read and no deprecation notice to receive.
- >-
  Adopt RFC 8594 Sunset/Deprecation headers before the first breaking change, not after. The `deprecated` field is
  already present in both generated documents and costs nothing to start using.
