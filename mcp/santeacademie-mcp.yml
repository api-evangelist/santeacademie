candidate:
  rationale: >-
    Worth deriving despite the absence, because this provider is an unusually clean MCP fit: 24 operations, all GET,
    no authentication, no rate limit, returning reference data (which DPC training exists, for which profession, funded
    by which scheme) that an assistant helping a French healthcare professional would need to answer almost any
    question. A read-only public catalog is the lowest-risk MCP surface there is.
  transport_recommended: streamable-http
  auth_recommended: none
  source_specs:
  - openapi/santeacademie-frontstage-openapi.json
  - openapi/santeacademie-connector-openapi.json
  tools:
  - name: list_professions
    description: >-
      List the healthcare professions (métiers) Santé Académie trains, with their stable codes and the B2C/B2B
      presentation for each. Call first — every other tool's profession filter takes one of these codes.
    rest:
    - GET /api/jobs
    inputSchema_source: 'openapi: /api/jobs parameters (page, itemsPerPage, pagination, exists[jobParent])'
    confidence: high
  - name: search_training_topics
    description: >-
      Search DPC training topics, filtered by profession code, thematic, and whether the topic is delivered as a
      virtual classroom or is qualifying.
    rest:
    - GET /api/topics-search
    inputSchema_source: >-
      openapi: /api/topics-search parameters (externalCode, topicJobs.job.externalCode, topicThematics.thematic.id,
      topicCourses.course.virtualClassroom, topicCourses.course.qualifying, order[rank], order[rankB2b], page,
      itemsPerPage)
    confidence: high
  - name: get_training_topic
    description: >-
      Get one training topic by slug, with its embedded courses, trainers, funding schemes and per-profession priced
      products.
    rest:
    - GET /api/topics/{slug}
    confidence: high
    note: >-
      This is the highest-value single tool in the set — the embedded Product objects are the only place the price and
      the professional's indemnity are published at all.
  - name: get_topic_search_facets
    description: Return the legal facet values (professions, thematics) accepted by search_training_topics.
    rest:
    - GET /api/topics-search/filters
    confidence: high
  - name: search_resources
    description: >-
      Search content resources — webinars, articles and course assets — by category, profession, space, thematic and
      status, sortable by view count or editorial rank.
    rest:
    - GET /api/resources-search
    confidence: high
  - name: get_resource
    description: Get one resource by slug, with its category, professions and trainers.
    rest:
    - GET /api/resources/{slug}
    - GET /connector/api/resource/{slug}
    confidence: high
  - name: get_resource_topics
    description: List the training topics attached to a resource.
    rest:
    - GET /api/resources/{slug}/topics
    confidence: high
  - name: get_resource_search_facets
    description: Return the legal facet values (categories, professions, thematics) accepted by search_resources.
    rest:
    - GET /api/resources-search/filters
    confidence: high
  - name: get_custom_catalog
    description: Get a B2B customer-specific catalog by slug, with its topics, FAQs and funding options.
    rest:
    - GET /api/custom-catalogs/{slug}
    - GET /connector/api/custom-catalog/{slug}
    confidence: high
    caution: >-
      Catalog slugs identify named B2B customers (the payload carries externalOrganizationId, a customer logo and
      theme). A tool that enumerates or guesses slugs would expose one customer's curated catalog to another. Any real
      implementation should require an exact slug and never list.
  - name: count_topics_by_profession
    description: Topic counts broken down by profession and B2C/B2B space — a catalog coverage summary.
    rest:
    - GET /api/topics/jobs/counts-by-space
    confidence: high
  - name: search_articles
    description: Search the editorial article library behind santeacademie.com/media.
    rest:
    - GET /connector/api/search/article
    confidence: medium
    note: >-
      The Connector spec declares the query as a single required parameter named after a PHP DTO class
      (ArticleSearchQuery) with no schema, so the real input fields are undocumented. A tool cannot be given a correct
      inputSchema from the published specification alone.
  - name: get_article
    description: Get one editorial article by slug.
    rest:
    - GET /connector/api/article/{slug}
    confidence: high
  - name: list_faq
    description: List Santé Académie's published FAQ entries.
    rest:
    - GET /connector/api/faq
    confidence: high
  - name: list_funding_faq_and_testimonials
    description: List published learner testimonials.
    rest:
