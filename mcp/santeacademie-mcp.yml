    confidence: high
    caution: >-
      Testimonials carry named, photographed healthcare professionals. Surfacing them through an agent tool
      redistributes identified personal data; a real implementation should consider whether that is intended.
  - name: list_media_categories
    description: List the article/media categories.
    rest:
    - GET /connector/api/media/category
    confidence: high
  - name: list_profession_spaces
    description: List the profession spaces (B2C / B2B) used as a discriminator across the catalog.
    rest:
