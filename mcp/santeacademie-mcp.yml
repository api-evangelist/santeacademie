recommendations:
- >-
  If Santé Académie ever wants to be reachable by the assistants French healthcare professionals already use, this
  catalog is the surface: it is already public, already read-only, needs no auth, and answers the questions
  practitioners actually ask ("which funded DPC training exists for my profession this year?").
- >-
  Before exposing it, fix two things that the derivation above had to flag: expand the four DTO-class query
  parameters so a tool can have a real inputSchema, and decide deliberately about custom-catalog slugs, trainer
  biographies and testimonial photos, all of which are identified personal or customer data currently served without a
  credential.
