note: >-
  Two different kinds of conformance are recorded here and they must not be blurred. `standards` is what the APIs
  conform to technically — mostly `false`, derived from the specs and live responses. `sector_accreditations` is the
  regulated-training compliance Santé Académie genuinely holds and publishes as certification marks on its own site.
  There is NO published information-security or data-protection certification (no SOC 2, no ISO 27001, no HDS
  health-data hosting attestation, no trust center), and this file says so explicitly rather than letting the
  sector marks stand in for one.
standards:
- id: openapi
  conforms: true
  version_declared:
    frontstage: 3.1.0
    connector: 3.0.0
  evidence: >-
    Both documents parse as OpenAPI and are served publicly and anonymously —
    https://frontstage.santeacademie.com/api/docs.jsonopenapi (200, application/vnd.openapi+json, 35,397 bytes) and
    https://frontstage.santeacademie.com/connector/api/ (200, application/json, 63,774 bytes). Saved verbatim under
    openapi/.
  caveat: >-
    Valid but unpublicised and incomplete as contracts: Frontstage names no host (servers[] is "/") and ships an
    empty tags[]; Connector ships no servers[] at all and keeps the generator's placeholder title "api". Neither is
    linked from any human-facing page — both were found by direct path probing.
- id: rfc9457
  name: Problem Details for HTTP APIs
  conforms: partial
  evidence: >-
    Frontstage returns `application/problem+json` with type/title/detail — verified live on
    https://frontstage.santeacademie.com/api/topics/nonexistent-slug-xyz-99 (404). It is the correct media type and
    the correct member names.
  caveat: >-
    Substantively non-conformant. `type` is the API Platform default https://tools.ietf.org/html/rfc2616#section-10
    on EVERY error, and `title` is the constant "An error occurred", so the document carries no per-problem identity —
    the whole purpose of the RFC. The sibling Connector API returns a bare JSON string ("Topic not found") and
    conforms not at all.
  detail_source: errors/santeacademie-problem-types.yml
- id: oauth2
  conforms: false
  evidence: >-
