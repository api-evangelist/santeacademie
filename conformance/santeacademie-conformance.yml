sector_accreditations:
  note: >-
    These are the compliance credentials Santé Académie actually publishes. They are French vocational-training and
    continuing-medical-education regulatory accreditations, verifiable in public national registries — NOT security or
    data-protection certifications. Scope matters: they say the company is authorised to deliver funded DPC training,
    not anything about how it protects data or runs its APIs.
  certifications:
  - name: Qualiopi
    kind: national quality certification for training providers (France, mandatory for public funding)
    published: true
    evidence:
      method: probed
      url: https://www.santeacademie.com/images/logos/logo-qualiopi.png
      http_status: 200
      note: certification mark served from the company's own domain and displayed in the site footer
  - name: ODPC — Organisme agréé auprès de l'Agence Nationale du DPC
    kind: sector accreditation to deliver funded Développement Professionnel Continu programmes
    published: true
    evidence:
      method: probed
      url: https://www.santeacademie.com/images/logos/odpc.png
      http_status: 200
    note: >-
      Corroborated by the product copy on https://www.santeacademie.com/formation/liberal ("formations agréées DPC")
      and by the enrollment flow, which finalises registration on the ANDPC's own agencedpc.fr.
  - name: France Compétences registration
    kind: national register of training providers
    published: true
    evidence:
      method: searched
      url: https://www.santeacademie.com/
      note: >-
        Claimed in the company's own public marketing copy. Recorded as a provider claim; the registry entry itself
