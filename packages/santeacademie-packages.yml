  Zero API client libraries in any registry, in any language. The two public catalog APIs have no SDK, no code sample
  and no generated client anywhere public — a consumer starts from the raw OpenAPI documents in openapi/.
- >-
  The two first-party Packagist packages are real but stale (2025-07-22 and 2025-01-20) and one declares no license.
  super-uploader-bundle has 47 releases and 0 downloads, which is the signature of code published for the company's
  own convenience rather than for adoption.
