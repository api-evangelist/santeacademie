findings:
- >-
  Six of sixteen entities have no endpoint of their own — Course, Product, Funding, Trainer, Thematic and Space are
  reachable only embedded inside a topic or catalog. An agent that wants the course catalogue must walk topics.
- >-
  Product is the pricing model (price + compensation per course x profession x funding scheme) and it is returned
  publicly, unauthenticated, embedded in topic payloads, while the website publishes no prices at all.
- >-
  Trainer and Testimonial payloads carry named, photographed, identified healthcare professionals with institutions
  and biographies, served without a credential.
- >-
  The Thematic relationship is filterable but not readable — a documented-looking asymmetry that will surprise any
  client trying to render a topic's themes.
