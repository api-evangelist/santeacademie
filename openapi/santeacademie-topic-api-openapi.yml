openapi: 3.2.0
info:
  title: Santeacademie Topic API
  version: '1.0'
  description: 'Operations tagged Topic across 2 of this provider''s published API definitions: santeacademie-connector-openapi.json, santeacademie-frontstage-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /
  description: ''
tags:
- name: Topic
  description: Topic
paths:
  /connector/api/search/topic:
    get:
      tags:
      - Topic
      description: Return the JSON containing topic search
      operationId: searchTopic
      parameters:
      - name: TopicSearchQuery
        in: query
        description: Query for topic search
        required: true
        schema:
          $ref: '#/components/schemas/TopicSearchQuery'
      responses:
        '200':
          description: The response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicSearch'
  /connector/api/topic/{slug}:
    get:
      tags:
      - Topic
      description: Return the JSON containing topic search
      operationId: findTopic
      parameters:
      - name: slug
        in: path
        description: Slug of the Topic on Frontstage
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic'
  /api/topics-search:
    parameters: []
    get:
      operationId: api_topics-search_get_collection
      tags:
      - Topic
      responses:
        '200':
          description: Topic collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Topic.CollectionTopicSearchRepresentation-topics-search.get'
            text/html:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Topic.CollectionTopicSearchRepresentation-topics-search.get'
      summary: Retrieves the collection of Topic resources.
      description: Retrieves the collection of Topic resources.
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: integer
          default: 1
        style: form
        explode: false
        allowReserved: false
      - name: itemsPerPage
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: integer
          default: 10
          minimum: 0
        style: form
        explode: false
        allowReserved: false
      - name: pagination
        in: query
        description: Enable or disable pagination
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: boolean
        style: form
        explode: false
        allowReserved: false
      - name: externalCode
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: externalCode[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: topicJobs.job.externalCode
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
        style: form
        explode: false
        allowReserved: false
      - name: topicJobs.job.externalCode[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
        allowReserved: false
      - name: topicThematics.thematic.id
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: integer
        style: form
        explode: false
        allowReserved: false
      - name: topicThematics.thematic.id[]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: array
          items:
            type: integer
        style: form
        explode: true
        allowReserved: false
      - name: topicCourses.course.virtualClassroom
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: boolean
        style: form
        explode: false
        allowReserved: false
      - name: topicCourses.course.qualifying
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: boolean
        style: form
        explode: false
        allowReserved: false
      - name: order[rank]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - asc
          - desc
        style: form
        explode: false
        allowReserved: false
      - name: order[rankB2b]
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - asc
          - desc
        style: form
        explode: false
        allowReserved: false
      deprecated: false
    servers:
    - url: /
      description: ''
  /api/topics-search/filters:
    parameters: []
    get:
      operationId: api_topics-searchfilters_get
      tags:
      - Topic
      responses:
        '200':
          description: Topic resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic.TopicSearchFilterRepresentation-topics-search.get'
            text/html:
              schema:
                $ref: '#/components/schemas/Topic.TopicSearchFilterRepresentation-topics-search.get'
        '404':
          description: Resource not found
      summary: Retrieves a Topic resource.
      description: Retrieves a Topic resource.
      parameters: []
      deprecated: false
    servers:
    - url: /
      description: ''
  /api/topics/jobs/counts-by-space:
    parameters: []
    get:
      operationId: api_topicsjobscounts-by-space_get
      tags:
      - Topic
      responses:
        '200':
          description: Topic resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic.TopicCountBySpaceAndJobRepresentation-topics.get'
            text/html:
              schema:
                $ref: '#/components/schemas/Topic.TopicCountBySpaceAndJobRepresentation-topics.get'
        '404':
          description: Resource not found
      summary: Retrieves a Topic resource.
      description: Retrieves a Topic resource.
      parameters: []
      deprecated: false
    servers:
    - url: /
      description: ''
  /api/topics/{slug}:
    parameters: []
    get:
      operationId: api_topics_slug_get
      tags:
      - Topic
      responses:
        '200':
          description: Topic resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topic.TopicRepresentation-topics.get'
            text/html:
              schema:
                $ref: '#/components/schemas/Topic.TopicRepresentation-topics.get'
        '404':
          description: Resource not found
      summary: Retrieves a Topic resource.
      description: Retrieves a Topic resource.
      parameters:
      - name: slug
        in: path
        description: Topic identifier
        required: true
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
        style: simple
        explode: false
        allowReserved: false
      deprecated: false
    servers:
    - url: /
      description: ''
