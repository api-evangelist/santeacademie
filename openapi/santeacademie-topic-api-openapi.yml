        isQualifying:
          type: boolean
        duration:
          type:
          - integer
          - 'null'
        isNew:
          type: boolean
        slug:
          type: string
        spaces:
          type: array
          items:
            type: string
        isEarlybird:
          type: boolean
        shortDescription:
