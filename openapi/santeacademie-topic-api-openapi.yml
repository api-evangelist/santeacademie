        topicFormatVirtualClassroom:
          oneOf:
          - $ref: '#/components/schemas/TopicFormat'
        topicFormatBusiness:
          oneOf:
          - $ref: '#/components/schemas/TopicFormat'
        topicFormatBlendedLearning:
          oneOf:
          - $ref: '#/components/schemas/TopicFormat'
        topicRedirect:
          type:
          - string
          - 'null'
        trainers:
          type: array
