probe_ethics_note: >-
  No limit was induced. Probing stopped at a handful of ordinary reads; API Evangelist does not flood a provider's
  endpoint to discover a threshold, so the absence recorded here is the absence of a PUBLISHED limit and of a runtime
  SIGNAL — not proof that no server-side throttle exists.
upstream_protection_observed:
  cdn: >-
    Neither public API host sits behind a CDN edge that advertises itself in the response headers (no x-cache, no via,
    no cf-ray). Requests appear to reach the origin directly. By contrast play.santeacademie.com and
    support.santeacademie.com are served through CloudFront.
  note: >-
    Combined with the absence of authentication, this means the two catalog APIs are unauthenticated, unrated and
    apparently unfronted — the single most material operational finding in this repo.
recommendations:
- >-
  Publish a limit and return RateLimit-* headers. With no credential to attribute traffic to and no throttle signal,
  the only tool available against abuse is a blunt block, which would break the company's own websites and learner app
  because they call these same endpoints.
- >-
  Declare a 429 response in both OpenAPI documents once a limit exists, so generated clients handle it.
