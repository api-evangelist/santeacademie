recommendations:
- >-
  Give each problem a real `type` URI and a specific `title`. As shipped, every Frontstage error is byte-identical
  except for `detail`, which defeats the point of problem+json.
- Declare the 404 on the Connector operations and return an object, not a bare string.
- Document the 400 shape for the four required search-query parameters, which are currently unusable from the spec.
