undeclared_but_expected:
  note: >-
    Statuses a caller must handle that neither specification mentions. Listed as expectations, not as documented
    contract — no 5xx or 429 was induced during probing and none is invented here.
  statuses:
  - status: 500
    reason: >-
      Observed live on the sibling API Platform service at https://contentstudio.santeacademie.com/api/docs.jsonld,
      which returned an HTML error page rather than problem+json — evidence that this Symfony stack can return
      unhandled 500s with a non-JSON body. Not induced on the public Frontstage routes.
    evidence:
      method: probed
      url: https://contentstudio.santeacademie.com/api/docs.jsonld
      http_status: 500
      content_type: text/html; charset=UTF-8
  - status: 429
    reason: No rate limit is published and none was observed; if one exists it is undocumented and unsignalled.
  - status: 400
    reason: >-
      The four Connector search operations declare a REQUIRED query parameter named after a PHP DTO class
      (TopicSearchQuery, ArticleSearchQuery, PharmacySearchQuery, HealthFacilitySearchQuery) with no schema. Callers
      will fail these requests and the specification describes no failure response for them.
