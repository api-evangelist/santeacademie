generated: '2026-08-17'
method: derived
source: >-
  openapi/santeacademie-frontstage-openapi.json (4xx responses) +
  openapi/santeacademie-connector-openapi.json + live anonymous error probes on 2026-08-17
note: >-
  Derived and probed only. There is no published error reference to search — Santé Académie has no developer
  documentation — so titles and remediation below are read off real responses and off the specs, never invented. Both
  documents are extremely thin on failure: the Frontstage spec declares exactly one error response (404) across ten
  operations, and the Connector spec declares NONE at all across fourteen.
format:
  frontstage: rfc9457-shaped
  connector: none
  detail: >-
    Frontstage returns the application/problem+json media type, so it is RFC 9457-shaped in form. It is not usefully
    conformant in substance: `type` is the API Platform default
    https://tools.ietf.org/html/rfc2616#section-10 — a section reference in a superseded RFC, identical for every
    error — and `title` is the constant string "An error occurred". A client cannot distinguish a missing topic from a
    validation failure by type or title, only by HTTP status and the free-text `detail`.
    Connector has no error format at all: it returns a bare quoted JSON string.
envelope:
  frontstage:
    media_type: application/problem+json
    fields:
    - name: type
      constant: https://tools.ietf.org/html/rfc2616#section-10
      note: not per-problem; the same value on every error
    - name: title
      constant: An error occurred
      note: not per-problem
    - name: detail
      note: the only field that varies (e.g. "Not Found", "Full authentication is required to access this resource.")
  connector:
    media_type: application/json
    fields: []
    shape: bare JSON string, e.g. "Topic not found"
