aid: santeacademie
name: Santé Académie
description: >-
  Santé Académie is a French continuing-professional-development (DPC) training provider for healthcare
  professionals — physicians, nurses, pharmacists, pharmacy technicians, nursing assistants and health-facility
  training managers — delivering e-learning, virtual classrooms and in-person courses funded through ANDPC, FIF-PL,
  FAF-PM, ANFH and OPCO schemes. The company is Qualiopi-certified, registered with France Compétences and approved
  by the Agence Nationale du DPC, and says more than 35,000 healthcare professionals have trained on its platform.
  Its public technical surface is a pair of unauthenticated read-only catalog APIs served from
  frontstage.santeacademie.com — the API Platform "Frontstage API" and a swagger-php "Connector API" — which expose
  the training catalog (topics, resources, courses, trainers, funding schemes, professions/métiers, FAQs,
  testimonials, pharmacy and health-facility lookup) that powers its own websites and learner app.
