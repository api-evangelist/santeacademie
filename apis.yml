x-contract-discovery:
  note: >-
    Recorded because the win here was NOT obvious and a second pass should not have to repeat it. The company has no
    developer portal, no /api path on its website, and 404s every canonical spec path on www.santeacademie.com. The
    contract was found by reading play.santeacademie.com's own JavaScript bundle, which named three internal API hosts,
    and then probing the API Platform / swagger-php default doc paths on each.
  hosts_found_in_app_bundle:
  - https://frontstage.santeacademie.com/connector/api
  - https://contentstudio.santeacademie.com/api
  - https://crossguard.santeacademie.com
  hosts_found_on_status_page:
  - frontstage
  - frontstage-meilisearch
  - contentstudio
  - contentplayer-web
  - crossguard-server
  - backstage
  - omnisearch
  - copilot
  - landing-gateway
  - spotlight
  - argocd-server
  - n8n
  winning_paths:
  - url: https://frontstage.santeacademie.com/api/docs.jsonopenapi
    status: 200
    content_type: application/vnd.openapi+json
    bytes: 35397
    result: OpenAPI 3.1.0, "Frontstage API", 10 paths
  - url: https://frontstage.santeacademie.com/connector/api/
    status: 200
    content_type: application/json
    bytes: 63774
    result: OpenAPI 3.0.0, 14 operations with operationIds
  ownership_check:
    verdict: pass
    reasoning: >-
      Neither spec carries a contact or termsOfService to check, and both name a host only implicitly, so ownership was
      established on the payload and the domain rather than on the fetch URL alone. Both documents are served from
      frontstage.santeacademie.com, a subdomain of the company's own domain; the schema vocabulary is unmistakably this
      company's business (CourseRepresentation, JobRepresentation for French healthcare métiers, FundingRepresentation
      for DPC/FIF-PL schemes, TrainerRepresentation, CustomCatalog); the API Platform resource namespaces are
      App\Catalog\Entity\Topic, App\External\Entity\Job, App\Market\Entity\Resource and App\Market\Entity\CustomCatalog;
      a live anonymous GET /api/jobs returned French profession records (MED/Médecin, appellation "Médecin
      généraliste"); the host is named in Santé Académie's own status page as the service `frontstage`; and
      play.santeacademie.com's production bundle calls this exact host. No sibling or third-party brand appears
      anywhere in either document.
  gated_or_empty:
  - url: https://contentstudio.santeacademie.com/api/docs.jsonopenapi
    status: 401
  - url: https://backstage.santeacademie.com/api
    status: 401
  - url: https://crossguard.santeacademie.com/api
    status: 404
  - url: https://frontstage.santeacademie.com/api/graphql
    status: 404
  - url: https://frontstage.santeacademie.com/.well-known/agent-card.json
    status: 404
x-artifact-notes:
  no_wellknown_pointer: >-
    well-known/santeacademie-well-known.yml is written but NO WellKnown or SecurityTxt pointer is emitted. Every
    canonical /.well-known/ path 404s on www, frontstage, play and simulateur. The one 200 is Intercom's own vendor
    security.txt on the CNAME'd help-center host (Canonical: app.intercom.com), which is not Santé Académie's.
  no_sdks_pointer: >-
    packages/santeacademie-packages.yml is written but NO SDKs pointer is emitted. sdk_count is 0 — the two
    first-party Packagist packages are general-purpose Symfony tooling, not clients for these APIs.
  no_idempotency_pointer: >-
    All 24 published operations are GET. Idempotency is inherent, not a provider feature, so no Idempotency pointer.
  no_security_pointer: >-
    probe-security-programs.py returned vdp=none trust=none. No first-party security.txt, no bug bounty, no trust
    center, no named security certification.
  no_deprecation_pointer: >-
    No deprecation policy, no Sunset/Deprecation headers, no versioning a caller can pin.
  no_agentcard_pointer: >-
    /.well-known/agent-card.json and the legacy /.well-known/agent.json returned 404 on all five hosts. No card was
    authored on the provider's behalf.
  no_asyncapi_or_webhooks_pointer: >-
    No event, streaming or webhook surface exists. Nothing fabricated.
  compliance_pointer_scope: >-
    The Compliance pointer is emitted for Qualiopi and ODPC/ANDPC accreditation — real, published, nationally
    verifiable certification marks served from the company's own domain. It is NOT an information-security claim:
    no SOC 2, ISO 27001 or HDS attestation is published, and the conformance artifact says so explicitly.
